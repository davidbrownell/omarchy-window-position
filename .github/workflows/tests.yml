name: tests

on:
  push:
  pull_request:

jobs:
  layout-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No dependencies, so there is nothing to install.
      - run: node tests/layout-reader.test.js
